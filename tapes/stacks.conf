# Four TUI stacks in one tab, all re-themed by halftone: C++ (btop), Rust/ratatui (gitui),
# Python/Textual (its demo), Go/Bubble Tea (glow).
theme x
tab Stacks
row fill: term btop -c tapes/btop.conf 1, term cd $TMPDIR/hwrepo && gitui 1
row fill: term uvx -q --from textual python -m textual 1, term glow -s dark AUDIT.md; read 1
