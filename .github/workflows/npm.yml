# Publishes halftone-cli and its four platform packages to npm when a version tag is pushed
# (git tag v0.1.0 && git push --tags). Run it by hand from the Actions tab for a dry run.
# Auth is npm trusted publishing (no token): on npmjs.com, each package's settings › Trusted
# Publisher must name this repo and this workflow file (npm.yml).
name: npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this run instead of a stored token

jobs:
  publish:
    runs-on: macos-latest # builds all four: macOS natively, Linux through rust-lld
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1+
      - run: rustup update stable && rustup default stable
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: cargo test --release --locked
      - run: sh npm/build.sh --pack
      - name: Publish (platform packages first, so halftone-cli never points at a missing one)
        run: |
          dry=$([ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && echo --dry-run || true)
          for p in halftone-cli-darwin-arm64 halftone-cli-darwin-x64 halftone-cli-linux-arm64 halftone-cli-linux-x64 halftone-cli; do
            npm publish "npm/out/$p" --access public $dry
          done
